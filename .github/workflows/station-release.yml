# Every push to main that touches the station app's source builds, tests, packages and publishes version
# 1.0.<run number>. The station PCs pick it up within a minute and install it when the floor is quiet.
# Only what goes into the app triggers it (src, the shared build props, the solution, this file):
# a change to the tests, the tools or the README alone ships nothing. Only main can publish, also
# when started by hand. Actions are pinned to a commit, with the version it was at beside it, and
# packages are restored in locked mode (packages.lock.json), so what is built is what was reviewed.
# This repo is private, so the update packages go to a public repo (UPDATE_REPO) as a GitHub Release.
# The station PCs read that repo without a token (UpdateService.DefaultUrl must point at it).
#
# Repo settings:
#   variable UPDATE_REPO      owner/name of the public releases repo (default below)
#   secret   RELEASE_TOKEN    token with Contents read and write on UPDATE_REPO
#   optional, for code signing with Azure Trusted Signing (skipped when AZURE_CLIENT_ID is not set):
#   secrets  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET   service principal with the
#            "Trusted Signing Certificate Profile Signer" role
#   variables AZURE_SIGNING_ENDPOINT (e.g. https://weu.codesigning.azure.net),
#            AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
name: station-release

on:
  push:
    branches: [main]
    paths:
      - 'apps/station/src/**'
      - 'apps/station/Directory.Build.props'
      - 'apps/station/Ventisol.Station.slnx'
      - '.github/workflows/station-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: station-release
  cancel-in-progress: false

env:
  UPDATE_REPO: ${{ vars.UPDATE_REPO || 'Optipeople/ventisol.station.updates' }}
  # Same as the Velopack package in Ventisol.Station.csproj.
  VPK_VERSION: 1.2.161
  # Never change: installed PCs find their updates by this id.
  PACK_ID: VentisolStation
  DOTNET_NOLOGO: true

jobs:
  release:
    # A run started by hand from another branch must not publish to the station PCs.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/station
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Run numbers only go up, so every release is newer than the one before.
      - name: Version
        id: version
        run: '"value=1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT'

      - run: dotnet restore Ventisol.Station.slnx --locked-mode
      - run: dotnet build Ventisol.Station.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}
      - run: dotnet test Ventisol.Station.slnx -c Release --no-build

      # Self-contained, so the PC needs no .NET installed. Version ends up in AssemblyInformationalVersion,
      # which the menu shows. Its own restore is locked too: CI is set, see Directory.Build.props.
      # win-x86 is for station PCs that run 32-bit Windows (an Intel Compute Stick, for one).
      - name: Publish
        run: |
          foreach ($rid in 'win-x64', 'win-x86') {
            dotnet publish src/Ventisol.Station/Ventisol.Station.csproj -c Release -r $rid --self-contained `
              -p:Version=${{ steps.version.outputs.value }} -o "${{ runner.temp }}/publish-$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - run: dotnet tool install -g vpk --version $env:VPK_VERSION

      # The previous release of each channel, so vpk can build a small delta package against it.
      # None on the first release of a channel.
      - name: Download previous release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          foreach ($channel in 'win', 'win-x86') {
            vpk download github --repoUrl "https://github.com/$env:UPDATE_REPO" --token $env:RELEASE_TOKEN --channel $channel -o "${{ runner.temp }}/releases"
            if ($LASTEXITCODE -ne 0) { Write-Host "No previous $channel release, so no delta this time"; $global:LASTEXITCODE = 0 }
          }

      - name: Pack
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        # Two channels: 'win' is the 64-bit build, under the names it has always had
        # (VentisolStation-win-Setup.exe), and 'win-x86' the 32-bit one (VentisolStation-win-x86-Setup.exe).
        # An installed app only ever looks for updates in its own channel.
        run: |
          $signing = $null
          # Unsigned, Defender may flag the installer (SchirmerFix got Wacatac), so sign when we can.
          if ($env:AZURE_CLIENT_ID) {
            $signing = '${{ runner.temp }}/trusted-signing.json'
            @{ Endpoint = '${{ vars.AZURE_SIGNING_ENDPOINT }}'; CodeSigningAccountName = '${{ vars.AZURE_SIGNING_ACCOUNT }}'; CertificateProfileName = '${{ vars.AZURE_SIGNING_PROFILE }}' } |
              ConvertTo-Json | Set-Content $signing -Encoding utf8
          } else {
            Write-Host "::warning::Not signed: AZURE_CLIENT_ID is not set"
          }
          foreach ($t in @(@{ Rid = 'win-x64'; Channel = 'win' }, @{ Rid = 'win-x86'; Channel = 'win-x86' })) {
            $pack = @(
              'pack', '--packId', $env:PACK_ID, '--packVersion', '${{ steps.version.outputs.value }}',
              '--packDir', "${{ runner.temp }}/publish-$($t.Rid)", '--mainExe', 'VentisolStation.exe',
              '--packTitle', 'Ventisol MES-skærm', '--packAuthors', 'Optipeople',
              '--runtime', $t.Rid, '--channel', $t.Channel,
              '--icon', 'src/Ventisol.Station/Assets/app.ico', '--outputDir', '${{ runner.temp }}/releases')
            if ($signing) { $pack += '--azureTrustedSignFile', $signing }
            vpk @pack
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload to ${{ env.UPDATE_REPO }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        # One GitHub Release with both channels: the first upload makes it, the second merges into it.
        run: |
          $v = '${{ steps.version.outputs.value }}'
          foreach ($channel in 'win', 'win-x86') {
            $upload = @(
              'upload', 'github', '--repoUrl', "https://github.com/$env:UPDATE_REPO", '--token', $env:RELEASE_TOKEN,
              '-o', '${{ runner.temp }}/releases', '--channel', $channel, '--publish', '--tag', "station-v$v",
              '--releaseName', "Ventisol MES-skærm $v")
            if ($channel -ne 'win') { $upload += '--merge' }
            # A version like 1.3.0-beta1 is a pre-release: the station PCs skip it.
            if ($v.Contains('-')) { $upload += '--pre' }
            vpk @upload
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
